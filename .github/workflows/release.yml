name: Publish to PyPI

# Publishes on a version tag, and only on a version tag. Uses PyPI Trusted
# Publishing (OIDC), so no API token is stored in this repository -- PyPI
# verifies the workflow identity directly. Configure the publisher once at
# https://pypi.org/manage/project/firewalla-snmp-proxy/settings/publishing/
# with: owner=kdesch5000, repo=firewalla-snmp-proxy,
#       workflow=release.yml, environment=pypi
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Fail if the tag does not match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a tag push may publish. workflow_dispatch is deliberately allowed to
    # reach `build` (a useful dry run of packaging) but never `publish`: a
    # dispatch carries no tag, so the version-parity check above cannot run,
    # and a PyPI upload is irreversible -- a version number burned by mistake
    # can never be reused.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
