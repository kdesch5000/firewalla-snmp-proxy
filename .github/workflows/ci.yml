name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match `requires-python` in pyproject.toml. If the floor here
        # ever fails, fix the code or raise the floor -- do not just drop the
        # job, or the metadata starts lying to people installing from PyPI.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify the vendor MIB is included in both artifacts
        run: |
          tar tzf dist/*.tar.gz | grep -q 'mibs/FIREWALLA-SNMP-PROXY-MIB.txt'
          python -m zipfile -l dist/*.whl | grep -q 'mibs/FIREWALLA-SNMP-PROXY-MIB.txt'

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
