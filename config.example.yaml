# firewalla-snmp-proxy example configuration
#
# Generate a real one with:
#     export FIREWALLA_MSP_TOKEN=<your token>
#     firewalla-snmp-proxy init --domain <your>.firewalla.net
#
# ...which discovers your switches and fills in the 'switches' list for you.

msp:
  # The hostname of your Firewalla MSP web console. Look at the URL you use to
  # reach MSP in a browser: https://dn-abc123.firewalla.net/ -> use the host.
  domain: "dn-abc123.firewalla.net"

  # The API token is read from the FIREWALLA_MSP_TOKEN environment variable by
  # default. Create one in the MSP web console under account settings.
  #
  # Prefer the environment variable (see install.sh, which writes a 0600
  # EnvironmentFile) or token_file. If you do put it inline below, the proxy
  # will warn you when the file is group- or world-readable.
  #
  # token_file: /etc/firewalla-snmp-proxy/token
  # token: "..."

  # Only needed if your account has more than one Firewalla box.
  # box_gid: "00000000-0000-0000-0000-000000000000"

# Seconds between MSP API polls. Minimum 15.
#
# This is the main knob for staying under the MSP API's request quota: each
# cycle costs several calls, and once the quota is exhausted the API returns
# HTTP 429 to everything until it resets. 900 (15 minutes) is a safe default.
#
# You do NOT need to match your NMS's polling interval here -- see
# counter_smoothing below, and "How fresh is the data?" in the README.
poll_interval: 900

# How counters are presented between MSP refreshes.
#
#   ramp - Spread each newly-learned increment evenly across the window that
#          follows the poll which revealed it. This lets an NMS polling faster
#          than poll_interval compute correct rates: a 5-minute poller against
#          a 15-minute interval sees a third of the increment each time,
#          instead of zero, zero, then a 3x spike. Byte totals stay exact and
#          the ramp window is measured, so it self-adapts if a rate-limit
#          backoff stretches the real interval.
#
#          Costs: the graph lags by up to one poll interval, and bursts shorter
#          than the interval are averaged out. The API does not carry
#          within-window traffic shape, so that detail is not available to
#          publish either way.
#
#   raw  - Publish the last value fetched, unmodified. Correct if your NMS
#          polls at or slower than poll_interval; sawtooths if it polls faster.
counter_smoothing: ramp

# Observed-window ceiling past which ramping is skipped for that sample, in
# seconds. 0 derives it from poll_interval (2.5x). Prevents a long outage's
# accumulated bytes from being smeared across an equally long ramp, which would
# hide the recovery.
max_ramp_seconds: 0

# Ceiling on exponential backoff after the MSP API returns HTTP 429, in
# seconds. Backoff starts at poll_interval, doubles per consecutive 429, and is
# jittered. A Retry-After header from the API always wins over the computed
# delay. While backed off the poller issues no requests at all -- retrying
# through a 429 keeps the quota pinned and can extend the lockout.
max_backoff_seconds: 3600

# --- Staying useful when the MSP API is unavailable --------------------------
#
# Cache of the last successful API response. On startup, if the API cannot be
# reached (rate limited, network trouble), agents are rebuilt from this file so
# the NMS keeps seeing the device AND its full port set, instead of the device
# going down. Counters are frozen at their cached values, so derived rates read
# zero -- fwProxyServingCache and fwProxyIcmpStatus are what say so out loud.
#
# Set to "" to disable, in which case startup blocks until the API answers.
# Path shown is what a deployed service uses. Running as an ordinary user,
# `init` writes ~/.local/state/firewalla-snmp-proxy/ instead.
topology_cache: "/var/lib/firewalla-snmp-proxy/topology.json"

# Host to ping for live switch reachability, independent of the API.
#
# This is the only live signal available during a rate-limit lockout, so it is
# what makes serving cached data safe: the counters are admittedly old, but
# fwSwitchOnline and fwProxyIcmpStatus still reflect reality.
#
# Prefer a HOSTNAME over a literal IP -- if the switch's address changes via
# DHCP, a hardcoded IP silently starts reporting a dead switch. Leave empty to
# disable, and fwProxyIcmpStatus reports disabled(4).
#
# Needs no elevated privileges: an unprivileged ICMP datagram socket is used
# where net.ipv4.ping_group_range allows it, falling back to the ping binary.
ping_host: ""

# How often to ping, in seconds. Much more frequent than poll_interval is fine
# and intended -- ICMP costs no API quota, and during a lockout it is the only
# thing still telling you the truth.
ping_interval: 60
ping_timeout: 2.0

# Consecutive checks needed to confirm a transition. Asymmetric on purpose:
# coming back is unambiguous, going away is not, so a single dropped packet
# must not report the switch away. A check that cannot be CARRIED OUT at all
# (unresolvable name, no ICMP permission) counts as neither -- it moves no
# counters, because it is evidence of nothing.
ping_fail_threshold: 3
ping_recover_threshold: 1

listen:
  # 127.0.0.1 is the safe default: only this host can poll the proxy. Set to
  # 0.0.0.0 if your monitoring system runs elsewhere, and firewall the ports.
  address: "127.0.0.1"

  # Each switch gets its own UDP port, starting here (16100, 16101, ...).
  # One port per switch, rather than one port with several communities,
  # because some monitoring systems identify a device by IP:port.
  base_port: 16100

# SNMPv1/v2c community string. Grants read-only access; SET is always refused.
community: "public"

# Base OID for the vendor subtree, which carries the four things that have no
# standard MIB home: per-port PoE wattage, STP port role, SFP transceiver
# detail, and ACL counts.
#
# 99999 is a placeholder in unassigned IANA space (assignments are currently
# around 66649, so it will not collide). Change it only if you register your
# own Private Enterprise Number -- and then update mibs/FIREWALLA-SNMP-PROXY-MIB.txt
# to match.
enterprise_oid: "1.3.6.1.4.1.99999"

# Reported as sysContact.0 and sysLocation.0.
# Override sysObjectID.0. Defaults to <enterprise_oid>.2.
#
# Only needed when REPLACING an existing SNMP proxy for the same switch.
# Monitoring systems key their device and OS detection on sysObjectID, so
# keeping the old value makes your NMS treat this as the same device and keep
# its existing OS definition, icon and historical port graphs. Leave unset for
# a fresh install.
#
# sys_object_id: "1.3.6.1.4.1.8072.3.2.10.99.2"

sys_contact: ""
sys_location: ""

# Where to persist counter offsets. This is what keeps your traffic graphs
# from showing a huge negative spike when the Firewalla resets its port
# counters, or when this proxy restarts. Must be writable by the service user.
state_file: "/var/lib/firewalla-snmp-proxy/counters.json"

switches:
  - mac: "20:6D:31:00:00:01"
    port: 16100
    # Optional: override the name reported as sysName.0 (and lldpLocSysName).
    # Without this, sysName is the switch's hostname from the Firewalla API.
    # name: "core-switch"
    # Optional: a different community for this switch only
    # community: "another-community"
